# Publica el sitio en GitHub Pages con cada push a main:
# la landing de LemonSuly en la raíz y el taller de tortas en /taller/.
# Requiere Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Armar el sitio
        run: |
          mkdir -p _site/taller
          cp -r landing/. _site/
          cp index.html _site/taller/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
